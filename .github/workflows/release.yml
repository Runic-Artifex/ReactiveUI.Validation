name: Package release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify the accepted Build evidence and run every release check without creating the GitHub release or pushing to nuget.org
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: validation-package-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  # Read-only: binds the release to the accepted Build of this main SHA, verifies
  # its package, test and gate evidence, then runs every check of the later jobs.
  # It does not rebuild. In a dry run this is the last job.
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.pair.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      # sha256sum lines of the pair; later jobs check their download against them.
      sha256: ${{ steps.pair.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run release guard fixtures
        run: python3 -B -m unittest discover -s eng/release -p test_release_assets.py -v
      - name: Resolve accepted Build evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py resolve --output artifacts/release-input/source.json
      - name: Download digest-verified Build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py download --source-report artifacts/release-input/source.json --output artifacts/release-input
      - name: Verify package and consumer evidence
        run: python3 eng/release/release_assets.py verify --input artifacts/release-input --source-report artifacts/release-input/source.json --output artifacts/release-input/verified.json
      - name: Stage the verified Ubuntu pair
        run: python3 eng/release/release_assets.py stage --verified artifacts/release-input/verified.json --output artifacts/packages
      - name: Check the GitHub release without creating it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py check --packages artifacts/packages
      - name: Check nuget.org without pushing
        run: python3 eng/release/release_assets.py nuget-check --packages artifacts/packages
      - name: Record the package pair
        id: pair
        shell: bash
        working-directory: artifacts/packages
        run: |
          reactive=(RunicArtifex.ReactiveUI.Validation.Reactive.*.nupkg)
          version="${reactive[0]#RunicArtifex.ReactiveUI.Validation.Reactive.}"
          version="${version%.nupkg}"
          {
            echo "version=$version"
            echo 'sha256<<SHA256'
            sha256sum -- *.nupkg
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 30
      - name: Retain release guard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-guard-evidence-${{ github.run_id }}
          path: |
            artifacts/release-input/source.json
            artifacts/release-input/download-metadata.json
            artifacts/release-input/verified.json
          if-no-files-found: warn
          retention-days: 14
  github-release:
    needs: packages
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: artifacts/packages
          digest-mismatch: error
      - name: Check the pair against the packages job
        working-directory: artifacts/packages
        env:
          PACKAGES_SHA256: ${{ needs.packages.outputs.sha256 }}
        run: |
          test -n "$PACKAGES_SHA256"
          printf '%s\n' "$PACKAGES_SHA256" | sha256sum --check --strict
      - name: Validate and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py publish --packages artifacts/packages
  # The only job with id-token: write; it runs in the protected nuget environment.
  nuget:
    needs: [packages, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact-id }}
          path: artifacts/packages
          digest-mismatch: error
      - name: Check the pair against the packages job
        working-directory: artifacts/packages
        env:
          PACKAGES_SHA256: ${{ needs.packages.outputs.sha256 }}
        run: |
          test -n "$PACKAGES_SHA256"
          printf '%s\n' "$PACKAGES_SHA256" | sha256sum --check --strict
      # Keyless: refuses changed published versions, IDs the key could not push
      # and dependencies nuget.org does not list.
      - name: Check nuget.org before logging in
        run: python3 eng/release/release_assets.py nuget-check --packages artifacts/packages
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push missing packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 eng/release/release_assets.py nuget-push --packages artifacts/packages
  # dotnet restore reports NU1102 until the flat container lists a pushed version.
  # Holds no token or secret.
  indexed:
    needs: [packages, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait until nuget.org lists both packages
        env:
          VERSION: ${{ needs.packages.outputs.version }}
        run: python3 eng/release/release_assets.py wait-indexed "$VERSION"
