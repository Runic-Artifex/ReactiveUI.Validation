name: Package release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify accepted Build evidence without creating a release
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: write
concurrency:
  group: validation-package-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run release guard fixtures
        run: python3 -B -m unittest discover -s eng/release -p test_release_assets.py -v
      - name: Resolve accepted Build evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py resolve --output artifacts/release-input/source.json
      - name: Download digest-verified Build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py download --source-report artifacts/release-input/source.json --output artifacts/release-input
      - name: Verify package and consumer evidence
        run: python3 eng/release/release_assets.py verify --input artifacts/release-input --source-report artifacts/release-input/source.json --output artifacts/release-input/verified.json
      - name: Retain release guard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-guard-evidence-${{ github.run_id }}
          path: |
            artifacts/release-input/source.json
            artifacts/release-input/download-metadata.json
            artifacts/release-input/verified.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verification-only completion
        if: inputs.verify_only
        run: echo 'Accepted Build evidence verified; no release mutation requested.'
      - name: Release verified NuGet assets
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/release_assets.py publish --verified artifacts/release-input/verified.json
