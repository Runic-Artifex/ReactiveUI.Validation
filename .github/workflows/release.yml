name: Package release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test package dependency guards
        run: python -B -m unittest discover -s eng -p test_verify_packages.py -v
      - run: python eng/restore-fork-dependencies.py
      - working-directory: src
        run: dotnet build ReactiveUI.Validation.slnx -c Release -warnaserror
      - working-directory: src
        run: dotnet test --solution ReactiveUI.Validation.slnx -c Release -- --maximum-parallel-tests 4
      - working-directory: src
        run: dotnet pack ReactiveUI.Validation.slnx -c Release --no-build -o ../artifacts/packages
      - name: Verify package consumers
        run: python eng/verify-packages.py
      - name: Release NuGet assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=$(find artifacts/packages -maxdepth 1 -name 'Runic.ReactiveUI.Validation.*.nupkg' ! -name 'Runic.ReactiveUI.Validation.Reactive.*')
          version=$(basename "$package" | sed -E 's/^Runic.ReactiveUI.Validation\.(.*)\.nupkg$/\1/')
          gh release create "runic-v$version" artifacts/packages/*.nupkg --target "$GITHUB_SHA" --title "Runic ReactiveUI.Validation $version" --prerelease --generate-notes
