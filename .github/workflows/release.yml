name: Package release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verification:
    uses: ./.github/workflows/ci-build.yml
  release:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download the packages verified at this workflow SHA
        uses: actions/download-artifact@v4
        with:
          name: packages-ubuntu-latest
          path: artifacts/packages
      - name: Release NuGet assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=$(find artifacts/packages -maxdepth 1 -name 'Runic.ReactiveUI.Validation.*.nupkg' ! -name 'Runic.ReactiveUI.Validation.Reactive.*')
          version=$(basename "$package" | sed -E 's/^Runic.ReactiveUI.Validation\.(.*)\.nupkg$/\1/')
          gh release create "runic-v$version" artifacts/packages/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Runic ReactiveUI.Validation $version" --prerelease --generate-notes
