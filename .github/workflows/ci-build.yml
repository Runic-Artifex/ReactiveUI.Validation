name: Build
on:
  push:
    branches: [main, 'runic/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-consumers:
    needs: build
    uses: ./.github/workflows/native-validation.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable Git long paths on the Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - name: Test all package, native and generated acceptance guards
        run: python -B -m unittest discover -s eng -p 'test_verify_*.py' -v
      - name: Test release promotion guards
        if: runner.os == 'Linux'
        run: python -B -m unittest discover -s eng/release -p test_release_assets.py -v
      - name: Test upstream maintenance fixtures
        if: runner.os == 'Linux'
        run: |
          node eng/upstream/test-collect-inventory.mjs
          node eng/upstream/test-review.mjs
      - name: Restore pinned Runic DynamicData packages
        run: python eng/restore-fork-dependencies.py
      - name: Build .NET 10
        working-directory: src
        run: dotnet build ReactiveUI.Validation.slnx -c Release -warnaserror
      - name: Test both flavors
        working-directory: src
        run: dotnet test --solution ReactiveUI.Validation.slnx -c Release -- --maximum-parallel-tests 4 --report-trx
      - name: Run Primitives collection example
        run: dotnet run --project examples/CollectionValidation/Primitives/CollectionValidation.Primitives.csproj -c Release
      - name: Run Reactive collection example
        run: dotnet run --project examples/CollectionValidation/Reactive/CollectionValidation.Reactive.csproj -c Release
      - name: Pack Runic libraries
        working-directory: src
        run: dotnet pack ReactiveUI.Validation.slnx -c Release --no-build -o ../artifacts/packages
      - name: Verify package consumers
        run: python eng/verify-packages.py
      - name: Execute generated consumers of both packed flavors
        shell: bash
        run: |
          rid=linux-x64
          if [[ "$RUNNER_OS" == "Windows" ]]; then rid=win-x64; fi
          python eng/verify-generated-validation.py --rid "$rid" --mode managed --package-feed artifacts/packages
      - name: Bind the verified package pair to this checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem artifacts/packages -File -Filter '*.nupkg' | Sort-Object Name)
          if ($files.Count -ne 2) { throw 'Expected exactly two verified packages' }
          $versions = @()
          foreach ($file in $files) {
            if ($file.Name -cnotmatch '^Runic\.ReactiveUI\.Validation(\.Reactive)?\.([0-9][0-9A-Za-z.+-]*)\.nupkg$') { throw "Unexpected package: $($file.Name)" }
            $versions += $Matches[2]
          }
          if (@($versions | Select-Object -Unique).Count -ne 1 -or @($files | Where-Object Name -Match '^Runic\.ReactiveUI\.Validation\.Reactive\.').Count -ne 1) { throw 'Expected matching versions of both flavors' }
          $packages = @($files | ForEach-Object { [ordered]@{ filename = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size = $_.Length } })
          [ordered]@{ source = $env:GITHUB_SHA; packages = $packages } | ConvertTo-Json -Depth 4 | Set-Content artifacts/packages/package-manifest.json -Encoding utf8
      - name: Upload the exact verified package pair
        id: package_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/package-manifest.json
      - name: Require the uploaded artifact identity
        shell: pwsh
        env:
          PACKAGE_ARTIFACT_ID: ${{ steps.package_upload.outputs.artifact-id }}
        run: |
          if ($env:PACKAGE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'Package upload did not produce an artifact ID' }
      - name: Download this host's uploaded package pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.package_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/verified-packages
          digest-mismatch: error
      - name: Verify package artifact byte roundtrip
        shell: pwsh
        env:
          ROUNDTRIP_PATH: ${{ runner.temp }}/verified-packages
        run: |
          $ErrorActionPreference = 'Stop'
          $originals = @(Get-ChildItem artifacts/packages -File | Where-Object { $_.Extension -eq '.nupkg' -or $_.Name -eq 'package-manifest.json' })
          $downloaded = @(Get-ChildItem $env:ROUNDTRIP_PATH -File -Recurse)
          if ($originals.Count -ne 3 -or $downloaded.Count -ne 3) { throw 'Expected only the package pair and manifest in the roundtrip' }
          foreach ($file in $originals) {
            $copy = Join-Path $env:ROUNDTRIP_PATH $file.Name
            if (-not (Test-Path $copy -PathType Leaf)) { throw "Missing roundtrip file: $($file.Name)" }
            if ((Get-Item $copy).Length -ne $file.Length -or (Get-FileHash $copy -Algorithm SHA256).Hash -cne (Get-FileHash $file.FullName -Algorithm SHA256).Hash) { throw "Artifact byte mismatch: $($file.Name)" }
          }
          Write-Host 'Package artifact roundtrip verified: two packages and source manifest'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          if-no-files-found: error
          name: validation-${{ matrix.os }}
          path: |
            src/TestResults
            artifacts/verification/package-smoke/*.log
            artifacts/verification/package-smoke/*.json
            artifacts/verification/generated-gates/*.log
            artifacts/verification/generated-gates/*.json
            artifacts/verification/generated-gates/*-generated/**/*.cs
            artifacts/verification/generated-gates/*-inputs/**/*.cs
            artifacts/verification/generated-gates/*-inputs/**/*.csproj
            artifacts/verification/generated-gates/*-inputs/**/*.json
            artifacts/verification/generated-gates/*-inputs/**/*.txt
            artifacts/verification/generated-gates/*-inputs/**/*.props
            artifacts/verification/generated-gates/*-inputs/**/*.targets
            artifacts/verification/generated-gates/*-inputs/**/*.editorconfig
            artifacts/verification/generated-gates/*-inputs/**/*.globalconfig
            artifacts/verification/generated-gates/*-inputs/GeneratedValidation.*.dll
            artifacts/verification/generated-gates/*-runtime/GeneratedValidation.*
            artifacts/verification/generated-gates/*-inputs/*-compiler.rsp
            artifacts/verification/generated-gates/*-inputs/*-Configuration.*.dll
            artifacts/verification/generated-gates/*.compiler-input.txt
            artifacts/verification/generated-gates/GeneratedValidation.Precompiled.*.dll
            artifacts/verification/generated-gates/GeneratedValidation.LegacyPeer.*.dll
            artifacts/verification/generated-gates/GeneratedValidation.ExpressionParams.*.dll
            artifacts/verification/generated-gates/GeneratedValidation.ExpressionParams.*.pdb
            artifacts/verification/generated-gates/Runic.Validation.PeerGeneratedCaller.dll
            artifacts/verification/generated-gates/MetadataInspector.dll
            artifacts/verification/generated-gates/historical-peer.source.cs
