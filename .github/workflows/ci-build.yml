name: Build
on:
  push:
    branches: [main, 'runic/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-consumers:
    needs: build
    uses: ./.github/workflows/native-validation.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5.3.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test package dependency guards
        run: python -B -m unittest discover -s eng -p test_verify_packages.py -v
      - name: Restore pinned Runic DynamicData packages
        run: python eng/restore-fork-dependencies.py
      - name: Build .NET 10
        working-directory: src
        run: dotnet build ReactiveUI.Validation.slnx -c Release -warnaserror
      - name: Test both flavors
        working-directory: src
        run: dotnet test --solution ReactiveUI.Validation.slnx -c Release -- --maximum-parallel-tests 4 --report-trx
      - name: Run Primitives collection example
        run: dotnet run --project examples/CollectionValidation/Primitives/CollectionValidation.Primitives.csproj -c Release
      - name: Run Reactive collection example
        run: dotnet run --project examples/CollectionValidation/Reactive/CollectionValidation.Reactive.csproj -c Release
      - name: Pack Runic libraries
        working-directory: src
        run: dotnet pack ReactiveUI.Validation.slnx -c Release --no-build -o ../artifacts/packages
      - name: Verify package consumers
        run: python eng/verify-packages.py
      - name: Upload the exact verified package pair
        uses: actions/upload-artifact@v4.6.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            src/TestResults
